<main><h1>Bosque do tigre</h1><p>Floresta densa, abrigo sob uma rocha inclinada, cama de folhas, nascente com riacho e lagoa, clareiras com cervos e javali, pegadas e marcas de garras. O tigre descansa em terreno seco.</p><img src="tiger-habitat.png" alt="Novo bosque do tigre no jogo"><p><a href="../">Abrir o jogo</a> — gere um novo mundo para encontrar o novo habitat.</p></main></html>
